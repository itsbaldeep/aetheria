name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Protocol codegen
        run: make content

      - name: gofmt + vet
        run: |
          make fmtcheck
          make vet

      - name: Go tests
        run: go test ./...

      - name: contentlint
        run: go run ./tools/contentlint

      - name: Godot proto tests
        run: |
          curl -sL -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q godot.zip -d /tmp/godot
          mkdir -p "$HOME/.config/godot"
          cd client && LD_LIBRARY_PATH="" /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://scripts/test_proto.gd 2>&1 | grep -q "ALL PASS"
