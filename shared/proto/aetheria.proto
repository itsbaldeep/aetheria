// Aetheria wire protocol — root package.
// Single source of truth for the client↔server contract. See docs/protocol.md
// for the generated reference.
syntax = "proto3";

package aetheria;

option go_package = "github.com/itsbaldeep/aetheria/server/gen";

// One logical message on the wire. Every WebSocket frame is a single Envelope
// carrying a typed message plus optional trace context.
message Envelope {
  // client-generated monotonic sequence number for request/response pairing.
  uint64 seq = 1;
  // 1 = request (client intent or server command), 2 = response/event.
  Kind kind = 2;
  // Type tag of `payload` (message full name). Sent so decoders can dispatch.
  string payload_type = 3;
  bytes payload = 4;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_REQUEST = 1;
    KIND_EVENT = 2;
  }
}

// M0: connection liveness check. Client → server, server replies Pong with
// the same `sent_at_unix_ms` and current server unix ms.
message Ping {
  int64 sent_at_unix_ms = 1;
}

message Pong {
  int64 sent_at_unix_ms = 1;
  int64 server_time_unix_ms = 2;
}

// M0: post-connect greeting. Server → client immediately after the WS
// handshake. Carries the protocol version for mismatch detection.
message ServerHello {
  string protocol_version = 1;   // e.g. "0.1.0"
  string game_name = 2;          // from branding.json
  uint32 tick_rate_hz = 3;       // server simulation rate
}

// M1: session validation happens on the WS handshake itself (HTTP header).
// This message is reserved for in-band re-auth / heartbeat validation if the
// handshake path ever changes.
message SessionStatus {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_VALID = 1;
    STATE_EXPIRED = 2;
    STATE_BANNED = 3;
  }
  State state = 1;
  int64 expires_at_unix_ms = 2;
}

// ============================= M2: world presence =============================
// After ServerHello the client sends EnterWorld with a character id; the server
// replies EnterWorldAck with the entity id + spawn position, then streams
// 20 Hz WorldSnapshot frames. The client sends MoveIntent as movement intents;
// the server clamps speed and is authoritative.

// A 3-D vector. Y is up. Positions are world-space meters.
message Vec3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

// Client → server: enter the world with an existing character (M2).
message EnterWorld {
  int64 character_id = 1;
}

// Server → client: result of EnterWorld. `ok` true spawns the player into the
// AOI stream; `error` explains a rejection.
message EnterWorldAck {
  bool ok = 1;
  string error = 2;
  uint64 entity_id = 3;      // this player's world entity id
  string zone_id = 4;
  Vec3 position = 5;
  float max_speed = 6;       // server-clamped move speed for this character
}

// Client → server: movement intent. Either target (click-to-move) or a
// normalized direction (WASD) is set. Server validates, clamps speed, and
// integrates the position on the 20 Hz tick. Direction intents keep moving
// until a zero direction arrives.
message MoveIntent {
  Vec3 target = 1;        // click-to-move destination (optional)
  Vec3 direction = 2;     // normalized movement direction (optional)
  float speed = 3;        // requested speed in m/s (clamped server-side)
  float rot_y = 4;        // facing
}

// Server → client: a compact entity state included in snapshots.
message EntityState {
  uint64 entity_id = 1;
  string entity_type = 2;  // "player" | "npc" (mobs land in M3)
  string name = 3;
  string zone_id = 4;
  Vec3 position = 5;
  float rot_y = 6;
  float speed = 7;
  int64 hp = 8;
  int64 max_hp = 9;
  int32 level = 10;
  bool is_moving = 11;
}

// Server → client: one 20 Hz AOI snapshot. `entities` are new-or-changed
// nearby entities; `despawn_ids` are entities that left the viewer's AOI and
// should be removed client-side. `self` echoes the authoritative state of the
// receiving player so the client can reconcile its prediction.
message WorldSnapshot {
  uint64 tick = 1;
  uint64 self_id = 2;
  repeated EntityState self = 3;        // always exactly 0..1 entries
  repeated EntityState entities = 4;    // other entities in AOI
  repeated uint64 despawn_ids = 5;      // entities leaving AOI
}

// Client → server: leave the world (client sends before closing, but the
// server also handles abrupt disconnects on the WS read loop).
message LeaveWorld {};

// ========================= M3: chat, combat & mobs =========================
// After EnterWorld the client can target mobs/players, auto-attack, and cast
// skills. The server is authoritative: it validates cooldown/range/cost, rolls
// damage, applies mitigation, awards XP on kills, and handles death/respawn.
// Chat is relayed by channel (say = nearby, world = zone-wide).

// Client → server: request to cast one skill. `skill_id` must be a valid skill
// for the character's class. tabtarget kinds require `target_entity_id`; aimed
// kinds (ground-AoE) require `aim_position`; pbaoe/self ignore target.
message CastSkill {
  string skill_id = 1;
  uint64 target_entity_id = 2;
  Vec3 aim_position = 3;
}

// Client → server: set or clear auto-attack on a target. `active=false` (or
// target 0) clears it. Auto-attack repeats the class's `auto` skill while the
// target is alive and in range; the server validates it like any cast.
message AutoAttack {
  uint64 target_entity_id = 1;
  bool active = 2;
}

// Server → client: a combat/chat-log event. Every noteworthy combat moment
// emits one of these to the players who can see it (attacker, target, and AOI
// witnesses). `event_type` one of: hit, crit, miss, kill, death, xp, level_up,
// respawn, shield, heal.
message CombatEvent {
  string event_type = 1;
  uint64 source_id = 2;
  uint64 target_id = 3;
  string skill_id = 4;
  int64 amount = 5;            // damage/xp amount as relevant
  string message = 6;          // human-readable combat log line
  int32 new_level = 7;         // set on level_up
}

// Client → server: send a chat message on a channel. Server fills sender
// fields, rate-limits, and relays per channel rules. Channels: say (nearby),
// world (zone-wide).
message ChatMessage {
  string channel = 1;
  string text = 2;
  uint64 sender_id = 3;        // server-filled on relay
  string sender_name = 4;      // server-filled on relay
  int64 sent_at_unix_ms = 5;   // server-filled on relay
}

// Client → server: request respawn after death. Server moves the character to
// its zone's shrine, restores HP/MP, and replies RespawnAck.
message RespawnRequest {}

// Server → client: result of RespawnRequest.
message RespawnAck {
  bool ok = 1;
  string error = 2;
  string zone_id = 3;
  Vec3 position = 4;
}

// ==================== M4: items, inventory, loot, vendors ====================
// Ground drops appear as entities with entity_type "drop". The client picks
// them up within radius; the server is authoritative and a drop is claimed
// exactly once. Items live in a grid inventory plus equipment slots (weapon /
// chest / accessory). Vendors (npc_defs kind=vendor) buy and sell items; every
// gold mutation is written to gold_ledger (audited economy).

// Client → server: pick up a ground drop by entity id. Server enforces the
// pickup radius rule and single-claim; replies with a LootEvent result.
message PickupItem {
  uint64 drop_entity_id = 1;
}

// Client → server: equip an inventory item by instance id.
message EquipItem {
  uint64 item_id = 1;
}

// Client → server: unequip the item in an equipment slot.
message UnequipItem {
  string slot = 1;  // "weapon" | "chest" | "accessory"
}

// Client → server: sell inventory items to a vendor (credits gold).
message SellItem {
  uint64 item_id = 1;
  int32 quantity = 2;
}

// Client → server: buy an item def from a vendor's stock (pays gold).
message BuyItem {
  string vendor_id = 1;
  string item_def_id = 2;
  int32 quantity = 3;
}

// Server → client: one inventory/equipment/gold mutation result. `ok` false
// means the mutation was rejected (`error` explains). Carried as a CombatEvent
// with event_type "loot" for the error field compatibility below.
message LootEvent {
  bool ok = 1;
  string error = 2;
  uint64 item_id = 3;
  string item_def_id = 4;
  int32 quantity = 5;
  int64 gold = 6;        // signed gold change for this mutation
  int64 balance = 7;     // player's gold after the mutation
}

